server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (also in security-headers.conf)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://unpkg.com; connect-src 'self' https://unpkg.com" always;

    # Gzip + caching
    gzip on; gzip_types text/plain text/css application/json application/javascript text/xml;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d; add_header Cache-Control "public, immutable";
    }
    location = /health.json { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /playable/Cricket3D.html; }

    # Rate limit (basic)
    limit_req_zone $binary_remote_addr zone=req:10m rate=20r/s;
    limit_req zone=req burst=40 nodelay;
}
